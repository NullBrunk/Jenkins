<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 816" width="1100" height="816" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Kubernetes pipeline: from code to a new version running on Kubernetes and EC2</title>
<defs><marker id="m64748B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
<rect width="1100" height="816" rx="18" fill="#F8FAFC"/>
<text x="32" y="34" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">ONE RUN OF THE PIPELINE, STEP BY STEP</text>
<rect x="32" y="56" width="238" height="166" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="68" cy="94" r="21" fill="#4F46E5"/>
<g transform="translate(68,94) scale(0.9545454545454546)" fill="none" stroke="#FFFFFF" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 -10H12V5H-1L-6 11V5H-12Z"/></g>
<text x="252" y="99" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="end" letter-spacing="1">STEP 1</text>
<text x="52" y="144" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Announce</text>
<text x="52" y="164" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Posts a “build started”</text>
<text x="52" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start">message in the team chat.</text>
<rect x="46" y="188" width="161" height="22" rx="11.0" fill="#EEF2FF" stroke="#C7D2FE"/>
<text x="55" y="202.6" font-size="10" font-weight="600" fill="#3730A3" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">Notify, initialize time</text>
<rect x="298" y="56" width="238" height="166" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="334" cy="94" r="21" fill="#475569"/>
<g transform="translate(334,94) scale(0.9545454545454546)" fill="none" stroke="#FFFFFF" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><path d="M-6 -7L-13 0L-6 7M6 -7L13 0L6 7M2.5 -10L-2.5 10"/></g>
<text x="518" y="99" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="end" letter-spacing="1">STEP 2</text>
<text x="318" y="144" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Get the code</text>
<text x="318" y="164" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Downloads the latest source</text>
<text x="318" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start">code from GitHub.</text>
<rect x="312" y="188" width="123" height="22" rx="11.0" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="321" y="202.6" font-size="10" font-weight="600" fill="#334155" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">Backend: Checkout</text>
<rect x="564" y="56" width="238" height="166" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="600" cy="94" r="21" fill="#2563EB"/>
<g transform="translate(600,94) scale(0.9545454545454546)" fill="none" stroke="#FFFFFF"><circle r="9" stroke-width="4.5" stroke-dasharray="3.5 3.5"/><circle r="6.5" stroke-width="2.2"/><circle r="2.6" stroke-width="2"/></g>
<text x="784" y="99" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="end" letter-spacing="1">STEP 3</text>
<text x="584" y="144" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Build &amp; test backend</text>
<text x="584" y="164" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Compiles it, then runs the</text>
<text x="584" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start">automated tests.</text>
<rect x="578" y="188" width="148" height="22" rx="11.0" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="587" y="202.6" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">Backend: Build · Test</text>
<rect x="830" y="56" width="238" height="166" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="866" cy="94" r="21" fill="#2563EB"/>
<g transform="translate(866,94) scale(0.9545454545454546)" fill="none" stroke="#FFFFFF" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><path d="M-10 0a10 10 0 1 0 20 0a10 10 0 1 0 -20 0M-5 0.5L-1.5 4.5L5.5 -4"/></g>
<text x="1050" y="99" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="end" letter-spacing="1">STEP 4</text>
<text x="850" y="144" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Build &amp; test frontend</text>
<text x="850" y="164" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Installs dependencies, builds</text>
<text x="850" y="180" font-size="12" font-weight="400" fill="#475569" text-anchor="start">the site and runs its tests.</text>
<rect x="844" y="188" width="204" height="22" rx="11.0" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="853" y="202.6" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">Frontend: Install, Build, Test</text>
<rect x="32" y="262" width="238" height="166" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="68" cy="300" r="21" fill="#7C3AED"/>
<g transform="translate(68,300) scale(0.9545454545454546)" fill="none" stroke="#FFFFFF" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 -3a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M3 3L11 11"/></g>
<text x="252" y="305" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="end" letter-spacing="1">STEP 5</text>
<text x="52" y="350" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Check code quality</text>
<text x="52" y="370" font-size="12" font-weight="400" fill="#475569" text-anchor="start">SonarQube analyses the</text>
<text x="52" y="386" font-size="12" font-weight="400" fill="#475569" text-anchor="start">backend code.</text>
<rect x="46" y="394" width="185" height="22" rx="11.0" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="55" y="408.6" font-size="10" font-weight="600" fill="#5B21B6" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">Backend: SonarQube Analysis</text>
<rect x="298" y="262" width="238" height="166" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="334" cy="300" r="21" fill="#0284C7"/>
<g transform="translate(334,300) scale(0.9545454545454546)" fill="none" stroke="#FFFFFF" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12L11 -6V6L0 12L-11 6V-6ZM0 0V12M0 0L-11 -6M0 0L11 -6"/></g>
<text x="518" y="305" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="end" letter-spacing="1">STEP 6</text>
<text x="318" y="350" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Package the apps</text>
<text x="318" y="370" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Builds a Docker image of each</text>
<text x="318" y="386" font-size="12" font-weight="400" fill="#475569" text-anchor="start">app and publishes it.</text>
<rect x="312" y="394" width="154" height="22" rx="11.0" fill="#F0F9FF" stroke="#BAE6FD"/>
<text x="321" y="408.6" font-size="10" font-weight="600" fill="#075985" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">Docker Build &amp; push ×2</text>
<rect x="564" y="262" width="238" height="166" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="600" cy="300" r="21" fill="#EA580C"/>
<g transform="translate(600,300) scale(0.9545454545454546)" fill="none" stroke="#FFFFFF" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12L10 -8V0C10 7 5 11 0 13C-5 11 -10 7 -10 0V-8ZM-4 0L-1 3L4 -3"/></g>
<text x="784" y="305" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="end" letter-spacing="1">STEP 7</text>
<text x="584" y="350" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Security scan</text>
<text x="584" y="370" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Trivy inspects the backend</text>
<text x="584" y="386" font-size="12" font-weight="400" fill="#475569" text-anchor="start">image and writes a report.</text>
<rect x="578" y="394" width="80" height="22" rx="11.0" fill="#FFF7ED" stroke="#FED7AA"/>
<text x="587" y="408.6" font-size="10" font-weight="600" fill="#9A3412" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">Trivy Scan</text>
<path d="M273 139H295" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<path d="M539 139H561" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<path d="M805 139H827" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<path d="M273 345H295" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<path d="M539 345H561" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<path d="M949 224V242H151V258" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<rect x="830" y="262" width="238" height="166" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 5"/>
<circle cx="866" cy="300" r="21" fill="#E2E8F0"/>
<g transform="translate(866,300) scale(1.0)" fill="none" stroke="#64748B" stroke-width="2.20" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 -1H8V11H-8ZM-5 -1V-6a5 5 0 0 1 10 0V-1"/></g>
<text x="1050" y="305" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="end" letter-spacing="1">ALWAYS</text>
<text x="850" y="350" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Secrets stay secret</text>
<text x="850" y="370" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Docker Hub, GitHub, SSH and</text>
<text x="850" y="386" font-size="12" font-weight="400" fill="#475569" text-anchor="start">chat credentials live in</text>
<text x="850" y="402" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Jenkins' vault, not in the code.</text>
<path d="M683 430V466" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<rect x="32" y="470" width="1036" height="196" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
<circle cx="68" cy="508" r="21" fill="#16A34A"/>
<g transform="translate(68,508) scale(0.9545454545454546)" fill="none" stroke="#FFFFFF" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 1L12 -10L5 11L0 3ZM0 3L12 -10"/></g>
<text x="100" y="503" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">STEP 8</text>
<text x="100" y="524" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Deliver the new version</text>
<rect x="720.0" y="496" width="328" height="22" rx="11.0" fill="#F0FDF4" stroke="#BBF7D0"/>
<text x="729.0" y="510.6" font-size="10" font-weight="600" fill="#166534" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">Stages: Set new image k8s · Deploy frontend on EC2</text>
<rect x="334" y="506" width="200" height="22" rx="11.0" fill="#FFF7ED" stroke="#FED7AA"/>
<text x="343" y="520.78" font-size="10.5" font-weight="700" fill="#9A3412" text-anchor="start">DIFFERENT FROM THE EC2 PIPELINE</text>
<rect x="52" y="546" width="490" height="104" rx="12" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
<circle cx="86" cy="580" r="18" fill="#2563EB"/>
<g transform="translate(86,580) scale(0.8181818181818182)" fill="none" stroke="#FFFFFF" stroke-width="2.69" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12L10.4 -6V6L0 12L-10.4 6V-6Z"/></g>
<text x="116" y="576" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Backend → Kubernetes cluster</text>
<text x="116" y="596" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Jenkins points the deployment to the new image;</text>
<text x="116" y="612" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Kubernetes replaces the old copies of the app.</text>
<rect x="116" y="620" width="378" height="22" rx="11.0" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="125" y="634.6" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">kubectl set image deployment/backend backend=&lt;image&gt;:&lt;tag&gt;</text>
<rect x="568" y="546" width="490" height="104" rx="12" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
<circle cx="602" cy="580" r="18" fill="#16A34A"/>
<g transform="translate(602,580) scale(0.8181818181818182)" fill="#FFFFFF"><rect x="-12" y="-11" width="24" height="6" rx="1.5"/><rect x="-12" y="-3" width="24" height="6" rx="1.5"/><rect x="-12" y="5" width="24" height="6" rx="1.5"/></g>
<text x="632" y="576" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Frontend → EC2 server</text>
<text x="632" y="596" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Jenkins connects over SSH, downloads the new</text>
<text x="632" y="612" font-size="12" font-weight="400" fill="#475569" text-anchor="start">version and restarts the app.</text>
<rect x="632" y="620" width="285" height="22" rx="11.0" fill="#F0FDF4" stroke="#BBF7D0"/>
<text x="641" y="634.6" font-size="10" font-weight="600" fill="#166534" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">docker compose pull &amp;&amp; docker compose up -d</text>
<rect x="32" y="688" width="1036" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="52" y="712" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">AFTER EVERY RUN · EVEN WHEN SOMETHING FAILED</text>
<circle cx="67" cy="750" r="15" fill="#2563EB"/>
<g transform="translate(67,750) scale(0.7894736842105263)" fill="none" stroke="#FFFFFF" stroke-width="2.79" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 -12H3L9 -6V12H-8ZM3 -12V-6H9M-4 0H5M-4 4H5M-4 8H1"/></g>
<text x="92" y="746" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Test results</text>
<text x="92" y="763" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Published in Jenkins (JUnit)</text>
<circle cx="321" cy="750" r="15" fill="#EA580C"/>
<g transform="translate(321,750) scale(0.7894736842105263)" fill="none" stroke="#FFFFFF" stroke-width="2.79" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12L10 -8V0C10 7 5 11 0 13C-5 11 -10 7 -10 0V-8ZM-4 0L-1 3L4 -3"/></g>
<text x="346" y="746" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Security report</text>
<text x="346" y="763" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Trivy report as an HTML page</text>
<circle cx="575" cy="750" r="15" fill="#4F46E5"/>
<g transform="translate(575,750) scale(0.7894736842105263)" fill="none" stroke="#FFFFFF" stroke-width="2.79" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 -10H12V5H-1L-6 11V5H-12Z"/></g>
<text x="600" y="746" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Final message</text>
<text x="600" y="763" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Green = success, red = failure</text>
<circle cx="829" cy="750" r="15" fill="#475569"/>
<g transform="translate(829,750) scale(0.7894736842105263)" fill="none" stroke="#FFFFFF" stroke-width="2.79" stroke-linecap="round" stroke-linejoin="round"><path d="M-9 -7H9M-6 -7V11H6V-7M-3 -11H3V-7M-2 -3V7M2 -3V7"/></g>
<text x="854" y="746" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Cleanup</text>
<text x="854" y="763" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Frees disk space on Jenkins</text>
</svg>
