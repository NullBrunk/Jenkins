<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Deploy on Kubernetes: Jenkins points the backend to the new image and Kubernetes swaps the running copies</title>
<defs><marker id="m64748B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
<rect width="1000" height="630" rx="18" fill="#F8FAFC"/>
