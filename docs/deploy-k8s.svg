<circle cx="120" cy="238" r="22" fill="#2563EB"/>
<g transform="translate(120,238) scale(1.0)" fill="none" stroke="#FFFFFF"><circle r="9" stroke-width="4.5" stroke-dasharray="3.5 3.5"/><circle r="6.5" stroke-width="2.2"/><circle r="2.6" stroke-width="2"/></g>
<text x="120" y="288" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Jenkins</text>
<text x="120" y="307" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Runs one command</text>
<rect x="690" y="20" width="280" height="80" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="728" cy="60" r="20" fill="#0284C7"/>
<g transform="translate(728,60) scale(0.9090909090909091)" fill="none" stroke="#FFFFFF" stroke-width="2.42" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12L11 -6V6L0 12L-11 6V-6ZM0 0V12M0 0L-11 -6M0 0L11 -6"/></g>
<text x="760" y="56" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Docker Hub</text>
<text x="760" y="74" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Stores the packaged apps</text>
<rect x="290" y="150" width="680" height="296" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="326" cy="188" r="20" fill="#2563EB"/>
<g transform="translate(326,188) scale(0.9090909090909091)" fill="none" stroke="#FFFFFF" stroke-width="2.42" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12L10.4 -6V6L0 12L-10.4 6V-6Z"/></g>
<text x="358" y="184" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Kubernetes cluster</text>
<text x="358" y="203" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Keeps the app running and swaps versions for you</text>
<rect x="310" y="224" width="190" height="176" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="324" y="248" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">BEFORE</text>
<polygon points="357,284 376.1,295.0 376.1,317.0 357,328 337.9,317.0 337.9,295.0" fill="#94A3B8" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="357" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v1</text>
<polygon points="405,284 424.1,295.0 424.1,317.0 405,328 385.9,317.0 385.9,295.0" fill="#94A3B8" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="405" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v1</text>
<polygon points="453,284 472.1,295.0 472.1,317.0 453,328 433.9,317.0 433.9,295.0" fill="#94A3B8" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="453" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v1</text>
<text x="405" y="362" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">3 copies of the</text>
<text x="405" y="378" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">old version</text>
<path d="M504 312H531" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<rect x="535" y="224" width="190" height="176" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="549" y="248" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">DURING</text>
<polygon points="582,284 601.1,295.0 601.1,317.0 582,328 562.9,317.0 562.9,295.0" fill="#94A3B8" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="582" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v1</text>
<polygon points="630,284 649.1,295.0 649.1,317.0 630,328 610.9,317.0 610.9,295.0" fill="#94A3B8" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="630" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v1</text>
<polygon points="678,284 697.1,295.0 697.1,317.0 678,328 658.9,317.0 658.9,295.0" fill="#22C55E" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="678" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v2</text>
<text x="630" y="362" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Swapped one by one</text>
<text x="630" y="378" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">(rolling update)</text>
<path d="M729 312H756" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<rect x="760" y="224" width="190" height="176" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="774" y="248" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">AFTER</text>
<polygon points="807,284 826.1,295.0 826.1,317.0 807,328 787.9,317.0 787.9,295.0" fill="#22C55E" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="807" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v2</text>
<polygon points="855,284 874.1,295.0 874.1,317.0 855,328 835.9,317.0 835.9,295.0" fill="#22C55E" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="855" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v2</text>
<polygon points="903,284 922.1,295.0 922.1,317.0 903,328 883.9,317.0 883.9,295.0" fill="#22C55E" stroke="#F1F5F9" stroke-width="2" stroke-linejoin="round"/>
<text x="903" y="310" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">v2</text>
<text x="855" y="362" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">3 copies of the</text>
<text x="855" y="378" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">new version</text>
<text x="310" y="428" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">Illustration with 3 copies; the real number is set in your Kubernetes deployment.</text>
<path d="M120 186V60H686" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<circle cx="400" cy="60" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="400" y="64.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<path d="M214 275H286" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<circle cx="250" cy="275" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="250" y="279.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<path d="M830 104V146" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<circle cx="830" cy="125" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="830" y="129.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="30" y="466" width="940" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="61" cy="499" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="61" y="503.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="82" y="495" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Jenkins publishes the new image to</text>
<text x="82" y="512" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Docker Hub, with a unique tag.</text>
<circle cx="371" cy="499" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="371" y="503.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392" y="495" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Jenkins runs one command that points</text>
<text x="392" y="512" font-size="12" font-weight="400" fill="#475569" text-anchor="start">the backend to the new image.</text>
<circle cx="681" cy="499" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="681" y="503.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="702" y="495" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Kubernetes pulls it and swaps the</text>
<text x="702" y="512" font-size="12" font-weight="400" fill="#475569" text-anchor="start">running copies, step by step.</text>
<rect x="30" y="544" width="940" height="66" rx="12" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
<circle cx="52" cy="564" r="5" fill="#EF4444"/>
<circle cx="70" cy="564" r="5" fill="#F59E0B"/>
<circle cx="88" cy="564" r="5" fill="#22C55E"/>
<text x="52" y="590" font-size="12.5" font-weight="400" fill="#E2E8F0" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">$ kubectl set image deployment/backend backend=&lt;image&gt;:&lt;tag&gt;</text>
</svg>
