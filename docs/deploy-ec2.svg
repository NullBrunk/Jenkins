<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 588" width="1000" height="588" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Deploy on EC2: Jenkins logs in over SSH and each server downloads and restarts the new version</title>
<defs><marker id="m64748B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
<rect width="1000" height="588" rx="18" fill="#F8FAFC"/>
<rect x="30" y="150" width="200" height="210" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="130" cy="200" r="24" fill="#2563EB"/>
<g transform="translate(130,200) scale(1.0909090909090908)" fill="none" stroke="#FFFFFF"><circle r="9" stroke-width="4.5" stroke-dasharray="3.5 3.5"/><circle r="6.5" stroke-width="2.2"/><circle r="2.6" stroke-width="2"/></g>
<text x="130" y="252" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Jenkins</text>
<text x="130" y="271" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Runs the pipeline</text>
<g transform="translate(56,318) scale(0.8)" fill="none" stroke="#64748B" stroke-width="2.50" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 -1H8V11H-8ZM-5 -1V-6a5 5 0 0 1 10 0V-1"/></g>
<text x="76" y="316" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Uses an SSH key from</text>
<text x="76" y="332" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Jenkins' secret vault</text>
<rect x="700" y="20" width="270" height="80" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="738" cy="60" r="20" fill="#0284C7"/>
<g transform="translate(738,60) scale(0.9090909090909091)" fill="none" stroke="#FFFFFF" stroke-width="2.42" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12L11 -6V6L0 12L-11 6V-6ZM0 0V12M0 0L-11 -6M0 0L11 -6"/></g>
<text x="770" y="56" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Docker Hub</text>
<text x="770" y="74" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Stores the packaged apps</text>
<rect x="700" y="150" width="270" height="210" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="720" y="176" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Your servers</text>
<text x="720" y="192" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="start">set with BACKEND_HOST / FRONTEND_HOST</text>
<rect x="720" y="208" width="230" height="62" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<g transform="translate(750,239) scale(1.15)" fill="#64748B"><rect x="-12" y="-11" width="24" height="6" rx="1.5"/><rect x="-12" y="-3" width="24" height="6" rx="1.5"/><rect x="-12" y="5" width="24" height="6" rx="1.5"/></g>
<text x="778" y="236" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Backend server</text>
<text x="778" y="253" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="start">Runs the app in Docker</text>
<rect x="720" y="282" width="230" height="62" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<g transform="translate(750,313) scale(1.15)" fill="#64748B"><rect x="-12" y="-11" width="24" height="6" rx="1.5"/><rect x="-12" y="-3" width="24" height="6" rx="1.5"/><rect x="-12" y="5" width="24" height="6" rx="1.5"/></g>
<text x="778" y="310" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Frontend server</text>
<text x="778" y="327" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="start">Runs the site in Docker</text>
<path d="M130 146V60H696" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<circle cx="413" cy="60" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="413" y="64.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<path d="M234 255H696" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<circle cx="465" cy="255" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="465" y="259.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<path d="M835 104V146" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<circle cx="835" cy="125" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="835" y="129.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="30" y="384" width="940" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<circle cx="61" cy="416" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="61" y="420.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="82" y="412" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">Jenkins publishes the new version</text>
<text x="82" y="429" font-size="12" font-weight="400" fill="#475569" text-anchor="start">to Docker Hub.</text>
<circle cx="371" cy="416" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="371" y="420.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392" y="412" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">Jenkins logs in to each server over</text>
<text x="392" y="429" font-size="12" font-weight="400" fill="#475569" text-anchor="start">SSH, using its stored key.</text>
<circle cx="681" cy="416" r="11" fill="#2563EB" stroke="#F8FAFC" stroke-width="3"/>
<text x="681" y="420.2" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="702" y="412" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">Each server downloads the new version</text>
<text x="702" y="429" font-size="12" font-weight="400" fill="#475569" text-anchor="start">and restarts the app.</text>
<rect x="30" y="464" width="940" height="104" rx="12" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
<circle cx="52" cy="484" r="5" fill="#EF4444"/>
<circle cx="70" cy="484" r="5" fill="#F59E0B"/>
<circle cx="88" cy="484" r="5" fill="#22C55E"/>
<text x="52" y="512" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace"># what Jenkins runs on each server</text>
<text x="52" y="534" font-size="12.5" font-weight="400" fill="#E2E8F0" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">$ docker compose pull</text>
<text x="352" y="534" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace"># download the newest version</text>
<text x="52" y="554" font-size="12.5" font-weight="400" fill="#E2E8F0" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">$ docker compose up -d</text>
<text x="352" y="554" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Consolas,monospace"># restart the app with it</text>
</svg>
